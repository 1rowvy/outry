[package]
name = "routy-cli"
description = "Routy CLI: run and check executable API specs, keep them in sync with Go code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "routy"
path = "src/main.rs"

[dependencies]
routy-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
dirs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
base64 = "0.22"
crossbeam-channel = "0.5"
flate2 = "1"
# `routy lsp`: протокол поверх stdio; lsp-types 0.95 — последняя с `url::Url` в типах.
lsp-server = "0.7"
lsp-types = "0.95"
self-replace = "1"
sha2 = "0.10"
tar = "0.4"

