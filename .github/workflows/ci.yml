name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy -p routy-core -p routy-cli --all-targets -- -D warnings
      - run: cargo test -p routy-core -p routy-cli

  app:
    name: desktop app (typecheck + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - run: npm ci
        working-directory: app
      # Сборка фронта нужна и сама по себе (tsc), и для generate_context! в Rust.
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p routy-app --all-targets -- -D warnings

  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editors/tree-sitter-routy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # src/ сгенерирован и лежит в репозитории (его собирают Neovim и Helix): он должен совпадать с grammar.js.
      - run: npx --yes tree-sitter-cli@0.25.10 generate
      - run: git diff --exit-code -- src
      - run: npx --yes tree-sitter-cli@0.25.10 test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Webview собирается из app/src (ResponseView и др.) — проверка типов и сборка ловят расхождения.
      - run: npm run typecheck
      - run: npm run build
      - run: npx vsce package --no-dependencies -o routy.vsix
      - run: cargo build -p routy-cli
        working-directory: .
      # Настоящий VS Code (скачивается) с расширением и `routy lsp` из target/debug.
      - run: xvfb-run -a npm test
