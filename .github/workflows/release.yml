# Релиз: поднять версию (scripts/release.sh X.Y.Z), закоммитить, запушить тег vX.Y.Z.
# Workflow соберёт десктоп-приложение под macOS/Linux/Windows и CLI под 5 таргетов,
# подпишет артефакты обновлений и опубликует релиз вместе с latest.json для автообновления.
#
# Секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY            — содержимое ~/.tauri/routy.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — пароль ключа (пустой, если без пароля)
#   (опционально, macOS) APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID — подпись и нотаризация

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег, например v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Тег совпадает с версией в Cargo.toml и package.json
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "routy-app") | .version')
          npm_version=$(jq -r .version app/package.json)
          echo "tag=$TAG cargo=$cargo_version npm=$npm_version"
          [ "$TAG" = "v$cargo_version" ] || { echo "::error::tag $TAG != Cargo.toml v$cargo_version"; exit 1; }
          [ "$npm_version" = "$cargo_version" ] || { echo "::error::app/package.json $npm_version != $cargo_version"; exit 1; }
      - name: Черновик релиза
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Routy ${TAG#v}" --generate-notes --verify-tag
          fi
          # Черновик не находится поиском по tag_name в списке релизов — берём ID напрямую.
          # Сразу после создания API может его ещё не отдавать — несколько попыток.
          for i in 1 2 3 4 5; do
            id=$(gh release view "$TAG" --json databaseId -q .databaseId 2>/dev/null || true)
            [ -n "$id" ] && break
            sleep 3
          done
          [ -n "$id" ] || { echo "::error::release id for $TAG not found"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: create-release
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Раскомментировать, когда появится Apple Developer ID:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.TAG }}
          args: --target ${{ matrix.target }}
          # latest.json собирается из всех платформ матрицы — по нему работает автообновление.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  cli:
    needs: create-release
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — статические musl-сборки: работают на любом дистрибутиве. Их ставит install.sh.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          # ring собирает C/asm-код; cc-rs сам не находит musl-gcc.
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p routy-cli --target ${{ matrix.target }}
      - name: Смоук-тест
        # x86_64-бинарь на arm64-раннере macOS требует Rosetta — не рассчитываем на неё.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/routy"
          "$bin" --version
          "$bin" check examples/api
      - name: Упаковать и загрузить
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="routy-cli-${TAG}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir/routy.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            asset="dist/$name.zip"
          else
            cp "$dir/routy" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            asset="dist/$name.tar.gz"
          fi
          # Контрольная сумма рядом с архивом: её проверяют install.sh и `routy update`.
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "${asset#dist/}"; else shasum -a 256 "${asset#dist/}"; fi) > "$asset.sha256"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber

  publish:
    needs: [create-release, app, cli]
    runs-on: ubuntu-latest
    steps:
      # Пока релиз черновик, releases/latest/download/latest.json его не видит —
      # приложения начинают обновляться только после публикации.
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --repo ${{ github.repository }}
