name: Feature request
description: Suggest something Outry should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. A `.outry` snippet or a CLI example helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do now, or how other tools handle it.
