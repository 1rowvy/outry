# Обновления зависимостей: раз в неделю, minor/patch одним PR на экосистему.
# Tauri: Rust-крейты и npm @tauri-apps/* должны совпадать по minor (иначе Tauri CLI падает),
# а Dependabot не умеет группировать между экосистемами — minor/major обновляем руками.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directories: [/app, /editors/vscode]
    schedule: { interval: weekly }
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
